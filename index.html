<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Server Control Panel</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
}

.container {
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 20px;
  padding: 40px;
  max-width: 500px;
  width: 90%;
  text-align: center;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
}

h1 {
  font-size: 28px;
  margin-bottom: 8px;
  background: linear-gradient(90deg, #e94560, #0f3460);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.subtitle {
  color: #aaa;
  font-size: 14px;
  margin-bottom: 30px;
}

.restart-btn {
  width: 100%;
  padding: 18px;
  font-size: 18px;
  font-weight: bold;
  color: #fff;
  background: linear-gradient(135deg, #e94560, #c23152);
  border: none;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
}

.restart-btn:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(233, 69, 96, 0.6);
}

.restart-btn:active:not(:disabled) {
  transform: translateY(0);
}

.restart-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.status {
  margin-top: 20px;
  padding: 12px;
  border-radius: 8px;
  font-size: 14px;
  display: none;
}

.status.success {
  display: block;
  background: rgba(76, 175, 80, 0.2);
  border: 1px solid rgba(76, 175, 80, 0.5);
  color: #81c784;
}

.status.error {
  display: block;
  background: rgba(244, 67, 54, 0.2);
  border: 1px solid rgba(244, 67, 54, 0.5);
  color: #e57373;
}

.status.loading {
  display: block;
  background: rgba(255, 193, 7, 0.2);
  border: 1px solid rgba(255, 193, 7, 0.5);
  color: #ffd54f;
}

.info-box {
  margin-top: 25px;
  padding: 15px;
  background: rgba(255, 255, 255, 0.03);
  border-radius: 8px;
  font-size: 13px;
  color: #888;
  text-align: left;
  line-height: 1.6;
}

.info-box strong {
  color: #ccc;
}
</style>
</head>
<body>
<div class="container">
<h1>Server Control Panel</h1>
<p class="subtitle">Restart all game servers instantly</p>

<button class="restart-btn" id="restartBtn" onclick="restartServers()">
Restart All Servers
</button>

<div class="status" id="statusBox"></div>

<div class="info-box">
<strong>What happens when you click:</strong><br>
- All live servers receive a restart signal<br>
- Players are teleported to fresh servers<br>
- Players who were together stay together<br>
- Old servers shut down automatically
</div>
</div>

<script>
async function restartServers() {
  const btn = document.getElementById("restartBtn");
  const status = document.getElementById("statusBox");

  if (!confirm("Are you sure? This will restart ALL servers and teleport every player!")) {
    return;
  }

  btn.disabled = true;
  btn.textContent = "Sending signal...";

  status.className = "status loading";
  status.textContent = "Sending restart signal to all servers...";

  try {
    const response = await fetch("/.netlify/functions/restart", {
      method: "POST",
    });

    const data = await response.json();

    if (response.ok && data.success) {
      status.className = "status success";
      status.textContent = "Restart signal sent! All servers are restarting.";
      btn.textContent = "Restart Sent!";
    } else {
      status.className = "status error";
      status.textContent = "Error: " + (data.error || "Unknown error");
      btn.textContent = "Failed - Try Again";
    }
  } catch (err) {
    status.className = "status error";
    status.textContent = "Network error: " + err.message;
    btn.textContent = "Failed - Try Again";
  }

  setTimeout(() => {
    btn.disabled = false;
    btn.textContent = "Restart All Servers";
  }, 5000);
}
</script>
</body>
</html>
