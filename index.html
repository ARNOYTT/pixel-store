<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Webhook Sender</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 1.5rem;
            color: #333;
        }

        .form-group {
            margin-bottom: 1rem;
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        input[type="url"],
        input[type="text"],
        input[type="number"],
        textarea {
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        input[type="url"]:focus,
        input[type="text"]:focus,
        input[type="number"]:focus,
        textarea:focus {
            outline: none;
            border-color: #5865f2;
            box-shadow: 0 0 0 2px rgba(88, 101, 242, 0.1);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .helper-text {
            font-size: 12px;
            color: #666;
            margin-top: 6px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 0.5rem;
        }

        button {
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        #sendBtn {
            background: #5865f2;
            color: white;
        }

        #sendBtn:hover:not(:disabled) {
            background: #4752c4;
        }

        #sendBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #stopBtn {
            background: white;
            color: #dc3545;
            border: 1px solid #dc3545;
            display: none;
        }

        #stopBtn:hover:not(:disabled) {
            background: #f8f9fa;
        }

        .status {
            display: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            margin-top: 1rem;
            border: 1px solid;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border-color: #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border-color: #f5c6cb;
        }

        .status.warning {
            background: #fff3cd;
            color: #856404;
            border-color: #ffeaa7;
        }

        .progress {
            display: none;
            padding: 12px;
            border-radius: 6px;
            background: #cfe2ff;
            color: #084298;
            border: 1px solid #b6d4fe;
            font-size: 14px;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Discord Webhook Sender</h1>

        <div class="form-group">
            <label for="webhookUrl">Webhook URL</label>
            <input type="url" id="webhookUrl" placeholder="https://discord.com/api/webhooks/...">
            <div class="helper-text">Paste your Discord webhook URL here</div>
        </div>

        <div class="form-group">
            <label for="messageText">Message</label>
            <textarea id="messageText" placeholder="Type your message here..."></textarea>
            <div class="helper-text">Max 2000 characters</div>
        </div>

        <div class="form-group">
            <label for="username">Username (optional)</label>
            <input type="text" id="username" placeholder="Webhook Bot">
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="interval">Repeat interval (sec)</label>
                <input type="number" id="interval" value="0" min="0" max="3600">
                <div class="helper-text">0 = no delay</div>
            </div>
            <div class="form-group">
                <label for="times">Times to send</label>
                <input type="number" id="times" value="1" min="1" max="1000">
                <div class="helper-text">1 = send once</div>
            </div>
        </div>

        <div class="form-group" style="flex-direction: row; align-items: center; margin-top: 0.5rem;">
            <input type="checkbox" id="parallelMode" style="width: auto; margin-right: 8px;">
            <label for="parallelMode" style="margin-bottom: 0;">Send all at once (parallel)</label>
        </div>

        <div class="button-group">
            <button id="sendBtn">Send Message</button>
            <button id="stopBtn">Stop Sending</button>
        </div>

        <div id="status" class="status"></div>
        <div id="progress" class="progress">
            Sent: <span id="progressCount">0</span> / <span id="progressTotal">0</span>
        </div>
    </div>

    <script>
        const webhookInput = document.getElementById('webhookUrl');
        const messageInput = document.getElementById('messageText');
        const usernameInput = document.getElementById('username');
        const intervalInput = document.getElementById('interval');
        const timesInput = document.getElementById('times');
        const parallelMode = document.getElementById('parallelMode');
        const sendBtn = document.getElementById('sendBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusDiv = document.getElementById('status');
        const progressDiv = document.getElementById('progress');
        const progressCount = document.getElementById('progressCount');
        const progressTotal = document.getElementById('progressTotal');

        let isSending = false;
        let sentCount = 0;

        sendBtn.addEventListener('click', startSending);
        stopBtn.addEventListener('click', stopSending);

        async function startSending() {
            const webhookUrl = webhookInput.value.trim();
            const message = messageInput.value.trim();
            const username = usernameInput.value.trim();
            const interval = parseInt(intervalInput.value) || 0;
            const times = parseInt(timesInput.value);
            const useParallel = parallelMode.checked;

            if (!webhookUrl) {
                showStatus('error', 'Enter a webhook URL');
                return;
            }

            if (!message) {
                showStatus('error', 'Enter a message');
                return;
            }

            if (message.length > 2000) {
                showStatus('error', 'Message too long (max 2000 characters)');
                return;
            }

            if (!webhookUrl.includes('discord.com/api/webhooks')) {
                showStatus('error', 'Invalid Discord webhook URL');
                return;
            }

            if (isNaN(times) || times < 1) {
                showStatus('error', 'Times must be at least 1');
                return;
            }

            isSending = true;
            sentCount = 0;
            statusDiv.style.display = 'none';
            progressDiv.style.display = 'block';
            progressTotal.textContent = times;
            progressCount.textContent = '0';

            sendBtn.disabled = true;
            stopBtn.style.display = 'block';
            webhookInput.disabled = true;
            messageInput.disabled = true;
            usernameInput.disabled = true;
            intervalInput.disabled = true;
            timesInput.disabled = true;
            parallelMode.disabled = true;

            if (useParallel) {
                await sendParallel(webhookUrl, message, username, times);
            } else {
                await sendSequential(webhookUrl, message, username, times, interval);
            }

            if (isSending && sentCount === times) {
                showStatus('success', `All ${times} message(s) sent!`);
            }

            finishSending();
        }

        async function sendSequential(webhookUrl, message, username, times, interval) {
            for (let i = 0; i < times && isSending; i++) {
                if (i > 0 && isSending && interval > 0) {
                    await sleep(interval * 1000);
                }

                if (!isSending) break;

                try {
                    const payload = {
                        content: message
                    };

                    if (username) {
                        payload.username = username;
                    }

                    const response = await fetch(webhookUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    });

                    sentCount++;
                    progressCount.textContent = sentCount;

                    if (!response.ok) {
                        if (response.status === 404) {
                            showStatus('error', 'Webhook not found. Check the URL.');
                            break;
                        } else if (response.status === 401) {
                            showStatus('error', 'Webhook is invalid or expired.');
                            break;
                        }
                    }
                } catch (err) {
                    showStatus('error', 'Network error. Stopped sending.');
                    break;
                }
            }
        }

        async function sendParallel(webhookUrl, message, username, times) {
            const promises = [];

            for (let i = 0; i < times && isSending; i++) {
                const promise = (async () => {
                    try {
                        const payload = {
                            content: message
                        };

                        if (username) {
                            payload.username = username;
                        }

                        const response = await fetch(webhookUrl, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(payload)
                        });

                        sentCount++;
                        progressCount.textContent = sentCount;

                        if (!response.ok) {
                            if (response.status === 404) {
                                showStatus('error', 'Webhook not found. Check the URL.');
                            } else if (response.status === 401) {
                                showStatus('error', 'Webhook is invalid or expired.');
                            }
                        }
                    } catch (err) {
                        showStatus('error', 'Network error.');
                    }
                })();

                promises.push(promise);
            }

            await Promise.all(promises);
        }

        function stopSending() {
            isSending = false;
            showStatus('warning', 'Stopped');
            finishSending();
        }

        function finishSending() {
            isSending = false;
            progressDiv.style.display = 'none';
            sendBtn.disabled = false;
            stopBtn.style.display = 'none';
            webhookInput.disabled = false;
            messageInput.disabled = false;
            usernameInput.disabled = false;
            intervalInput.disabled = false;
            timesInput.disabled = false;
        }

        function showStatus(type, message) {
            statusDiv.textContent = message;
            statusDiv.style.display = 'block';
            statusDiv.className = 'status ' + type;
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
    </script>
</body>
</html>
